<!DOCTYPE html>
<html lang="{lang}">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="x-apple-disable-message-reformatting">
  <title>{t_title}</title>
</head>
<body style="margin:0;padding:0;background:#f2f5fb;">
  <div style="display:none;max-height:0;overflow:hidden;opacity:0;">{t_preheader}</div>
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="background:#f2f5fb;">
    <tr>
      <td align="center" style="padding:32px 12px 48px;">
        <table role="presentation" width="600" cellpadding="0" cellspacing="0" border="0" style="width:600px;max-width:100%;background:#ffffff;">

          <tr>
            <td style="padding:18px 32px;border-bottom:2px solid #141414;">
              <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0"><tr>
                <td align="left"><img src="{app_url}/planeola_rect.png" alt="Planeola" width="70" style="display:block;height:30px;width:auto;border:0;"></td>
                <td align="right" style="font-family:'JetBrains Mono', 'SFMono-Regular', Consolas, 'Courier New', monospace;font-size:9px;font-weight:700;letter-spacing:0.14em;text-transform:uppercase;color:#a1a1a1;">{t_tag}</td>
              </tr></table>
            </td>
          </tr>

          <tr>
            <td style="padding:34px 32px 30px;">
              <div style="font-family:'JetBrains Mono', 'SFMono-Regular', Consolas, 'Courier New', monospace;font-size:10px;font-weight:700;letter-spacing:0.12em;text-transform:uppercase;color:#8a8a8a;margin-bottom:6px;">{t_kicker}</div>
              <h1 style="margin:0 0 18px;font-family:'Space Grotesk', 'Helvetica Neue', Helvetica, Arial, sans-serif;font-size:26px;font-weight:700;letter-spacing:-0.025em;color:#141414;">{t_title}</h1>
              <p style="margin:0 0 24px;font-family:'Space Grotesk', 'Helvetica Neue', Helvetica, Arial, sans-serif;font-size:15px;line-height:1.62;color:#3d3d3d;">{t_body}</p>
              <div style="margin-bottom:14px;border:1px solid #dcdcd8;border-left:3px solid #c4c4c4;background:#f7f7f5;border-radius:10px;padding:14px 16px;">
                <div style="font-family:'JetBrains Mono', 'SFMono-Regular', Consolas, 'Courier New', monospace;font-size:10px;font-weight:700;letter-spacing:0.12em;text-transform:uppercase;color:#8a8a8a;margin-bottom:6px;">{t_previous}</div>
                <p style="margin:0;white-space:pre-wrap;font-family:'Space Grotesk', 'Helvetica Neue', Helvetica, Arial, sans-serif;font-size:14.5px;line-height:1.55;color:#767676;">{old_notes}</p>
              </div>
              <div style="margin-bottom:26px;border:1px solid #b7dcc2;border-left:3px solid #16a34a;background:#f0fdf4;border-radius:10px;padding:14px 16px;">
                <div style="font-family:'JetBrains Mono', 'SFMono-Regular', Consolas, 'Courier New', monospace;font-size:10px;font-weight:700;letter-spacing:0.12em;text-transform:uppercase;color:#15803d;margin-bottom:6px;">{t_new}</div>
                <p style="margin:0;white-space:pre-wrap;font-family:'Space Grotesk', 'Helvetica Neue', Helvetica, Arial, sans-serif;font-size:14.5px;line-height:1.55;color:#141414;">{new_notes}</p>
              </div>
              <table role="presentation" cellpadding="0" cellspacing="0" border="0"><tr>
              <td bgcolor="#2563eb" style="border:2px solid #141414;border-radius:10px;box-shadow:4px 4px 0 #141414;">
                <a href="{app_url}" style="display:inline-block;padding:13px 22px;font-family:'Space Grotesk', 'Helvetica Neue', Helvetica, Arial, sans-serif;font-size:15px;font-weight:700;letter-spacing:-0.01em;color:#ffffff;text-decoration:none;">{t_button}</a>
              </td>
            </tr></table>
            </td>
          </tr>

          <tr>
            <td style="padding:16px 32px;border-top:2px solid #141414;background:#fafafa;">
              <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0"><tr>
                <td align="left" style="font-family:'JetBrains Mono', 'SFMono-Regular', Consolas, 'Courier New', monospace;font-size:10px;color:#a1a1a1;">{t_footer}</td>
                <td align="right" style="font-family:'JetBrains Mono', 'SFMono-Regular', Consolas, 'Courier New', monospace;font-size:10px;color:#a1a1a1;">&copy; 2026 <a href="https://github.com/thomas-gld" style="color:#a1a1a1;text-decoration:underline;">github.com/thomas-gld</a></td>
              </tr></table>
            </td>
          </tr>

        </table>
      </td>
    </tr>
  </table>
</body>
</html>
