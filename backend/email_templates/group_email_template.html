<!doctype html>
<html lang="{lang}">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="x-apple-disable-message-reformatting" />
    <title>{subject}</title>
  </head>
  <body style="margin: 0; padding: 0; background: #f2f5fb">
    <table
      role="presentation"
      width="100%"
      cellpadding="0"
      cellspacing="0"
      border="0"
      style="background: #f2f5fb"
    >
      <tr>
        <td align="center" style="padding: 32px 12px 48px">
          <table
            role="presentation"
            width="600"
            cellpadding="0"
            cellspacing="0"
            border="0"
            style="width: 600px; max-width: 100%; background: #ffffff"
          >
            <tr>
              <td style="padding: 18px 32px; border-bottom: 2px solid #141414">
                <table
                  role="presentation"
                  width="100%"
                  cellpadding="0"
                  cellspacing="0"
                  border="0"
                >
                  <tr>
                    <td align="left" valign="middle" style="width: 1%; white-space: nowrap">
                      <img
                        src="{app_url}/planeola_rect.png"
                        alt="Planeola"
                        width="70"
                        style="
                          display: block;
                          height: 30px;
                          width: auto;
                          border: 0;
                          font-family:
                            &quot;Space Grotesk&quot;, &quot;Helvetica Neue&quot;,
                            Helvetica, Arial, sans-serif;
                          font-size: 18px;
                          font-weight: 700;
                          line-height: 30px;
                          letter-spacing: -0.02em;
                          color: #141414;
                        "
                      />
                    </td>
                    <td align="left" valign="middle" style="padding-left: 14px">
                      {org_header}
                    </td>
                    <td
                      align="right"
                      style="
                        font-family:
                          &quot;JetBrains Mono&quot;,
                          &quot;SFMono-Regular&quot;, Consolas,
                          &quot;Courier New&quot;, monospace;
                        font-size: 9px;
                        font-weight: 700;
                        letter-spacing: 0.14em;
                        text-transform: uppercase;
                        color: #a1a1a1;
                      "
                    >
                      {t_tag}
                    </td>
                  </tr>
                </table>
              </td>
            </tr>

            <tr>
              <td style="padding: 34px 32px 30px">
                <h1
                  style="
                    margin: 0 0 18px;
                    font-family:
                      &quot;Space Grotesk&quot;, &quot;Helvetica Neue&quot;,
                      Helvetica, Arial, sans-serif;
                    font-size: 26px;
                    font-weight: 700;
                    letter-spacing: -0.025em;
                    color: #141414;
                  "
                >
                  {subject}
                </h1>
                <div
                  style="
                    margin: 0 0 26px;
                    font-family:
                      &quot;Space Grotesk&quot;, &quot;Helvetica Neue&quot;,
                      Helvetica, Arial, sans-serif;
                    font-size: 15px;
                    line-height: 1.62;
                    color: #3d3d3d;
                  "
                >
                  {message_html}
                </div>
                <table
                  role="presentation"
                  cellpadding="0"
                  cellspacing="0"
                  border="0"
                >
                  <tr>
                    <td
                      bgcolor="#2563eb"
                      style="
                        border: 2px solid #141414;
                        border-radius: 10px;
                        box-shadow: 4px 4px 0 #141414;
                      "
                    >
                      <a
                        href="{app_url}"
                        style="
                          display: inline-block;
                          padding: 13px 22px;
                          font-family:
                            &quot;Space Grotesk&quot;,
                            &quot;Helvetica Neue&quot;, Helvetica, Arial,
                            sans-serif;
                          font-size: 15px;
                          font-weight: 700;
                          letter-spacing: -0.01em;
                          color: #ffffff;
                          text-decoration: none;
                        "
                        >{t_button}</a
                      >
                    </td>
                  </tr>
                </table>
              </td>
            </tr>

            <tr>
              <td
                style="
                  padding: 16px 32px;
                  border-top: 2px solid #141414;
                  background: #fafafa;
                "
              >
                <table
                  role="presentation"
                  width="100%"
                  cellpadding="0"
                  cellspacing="0"
                  border="0"
                >
                  <tr>
                    <td
                      align="right"
                      style="
                        font-family:
                          &quot;JetBrains Mono&quot;,
                          &quot;SFMono-Regular&quot;, Consolas,
                          &quot;Courier New&quot;, monospace;
                        font-size: 10px;
                        color: #a1a1a1;
                      "
                    >
                      &copy; 2026
                      <a
                        href="https://github.com/thomas-gld"
                        style="color: #a1a1a1; text-decoration: underline"
                        >github.com/thomas-gld</a
                      >
                    </td>
                  </tr>
                </table>
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
